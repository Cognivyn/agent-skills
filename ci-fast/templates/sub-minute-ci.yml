name: Sub-Minute Fast CI

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

concurrency:
  group: fast-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Aggregated Lint, Format & Typecheck (Parallel, Sub-5s execution)
  # -------------------------------------------------------------------------
  lint-and-typecheck:
    name: Lint, Format & Typecheck
    runs-on: ubuntu-latest # Or blacksmith-2vcpu-ubuntu-2204
    timeout-minutes: 2
    steps:
      - name: Blobless Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: 'blob:none'

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore Dependency Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Aggregated Checks
        run: |
          echo "Running fast lint, format, and typecheck in parallel..."
          bun lint &
          bun fmt --check &
          bun check &
          wait

  # -------------------------------------------------------------------------
  # Job 2: Build Application Once
  # -------------------------------------------------------------------------
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Blobless Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: 'blob:none'

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore Dependency Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}

      - name: Build
        run: bun run build

  # -------------------------------------------------------------------------
  # Job 3: Balanced Sharded Tests (Under 30s per shard)
  # -------------------------------------------------------------------------
  test:
    name: Test Shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Blobless Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: 'blob:none'

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore Dependency Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}

      - name: Run Sharded Tests
        run: |
          # If using bun test natively:
          bun test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          # Or if using Vitest with TimeSequencer:
          # bun vitest run --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=json --outputFile=shard-${{ matrix.shard }}.json
