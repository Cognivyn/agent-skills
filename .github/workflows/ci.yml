name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate agent skills
        run: ./agent-skills validate

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v

      - name: Check Markdown links and anchors
        run: python scripts/check_md_links.py
